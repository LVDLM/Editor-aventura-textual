name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - audio/sample-processing-phase-1-mainline

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
